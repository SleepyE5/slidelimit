name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SlideLimit.slnx

      - name: Build
        run: dotnet build SlideLimit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SlideLimit.slnx -c Release --no-build --logger 'console;verbosity=minimal'

      # Packing is the only step that reads the metadata a consumer sees: the
      # license expression, the generated XML documentation file, and whether the
      # library is actually where the nuspec says it is.
      # Named file rather than directory: on the exFAT volume this repository is
      # developed on, macOS leaves ._SlideLimit.csproj beside the real one, and a
      # directory argument then refuses to guess which project was meant.
      - name: Pack
        run: dotnet pack src/SlideLimit/SlideLimit.csproj -c Release --no-build
